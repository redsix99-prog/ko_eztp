name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir dist
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude '.nojekyll' \
            --exclude 'PROJECT_SPEC_KO.md' --exclude 'dist' \
            ./ dist/

      # JS/CSS는 브라우저와 Cloudflare가 길게 캐시하므로, 배포할 때마다 파일 주소 끝의 버전 값(?v=)을
      # 커밋 번호로 바꿔 방문자가 항상 최신 파일을 받게 합니다. (수동으로 바꿀 필요 없음)
      - name: Version static assets
        run: |
          V="${GITHUB_SHA::8}"
          find dist -name '*.html' -print0 | xargs -0 sed -i -E "s/\.(js|css)\?v=[0-9a-z]+\"/.\1?v=${V}\"/g"
          echo "asset version: ${V}"
          grep -rho --include='*.html' -E '[a-z0-9-]+\.(js|css)\?v=[0-9a-z]+' dist | sort -u | head -12

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 계정 ID는 비밀 값이 아닌 식별 번호라서 파일에 직접 적습니다.
          accountId: 7ae0afaa04fe3439643d1898e53e835b
          command: pages deploy dist --project-name=koeztp --branch=main