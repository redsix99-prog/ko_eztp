<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="google-adsense-account" content="ca-pub-5580189283913928"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>지역 소개 | 코리아 이지트립</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<header class="header"><div class="wrap">
  <a class="brand" href="index.html"><span class="brand-name">코리아 <b>이지트립</b></span><span class="brand-sub">Korea Easy Trip</span></a>
  <nav class="links" id="navigation" aria-label="주 메뉴"><a href="index.html#themes">테마별 장소</a><a href="index.html#destinations" class="on">서울 밖 여행</a><a href="index.html#itineraries">추천 코스</a><a href="index.html#newsteaser">관광 뉴스</a><a href="index.html#start">여행 준비</a><a href="index.html#experiences">체험·예약</a><a href="index.html#plan">일정 만들기</a></nav>
  <button class="nav-toggle" id="menuButton" aria-label="메뉴 열기" aria-expanded="false">☰</button>
  <a class="btn" href="index.html#plan" style="padding:10px 14px;font-size:14px">내 여행 만들기</a>
</div></header>
<main id="app"></main>
<footer class="footer"><div class="wrap"><div class="footgrid"><div><h3>코리아 이지트립</h3><p>한국 여행을 현지인처럼. 호기심 많은 여행자를 위한 독립 여행 정보 사이트입니다.</p></div><div><h3>바로가기</h3><a href="index.html#destinations">서울 밖 여행</a><a href="index.html#newsteaser">관광 뉴스</a><a href="index.html#plan">일정 만들기</a></div><div><h3>공식 링크</h3><a href="https://english.visitkorea.or.kr/" target="_blank" rel="noopener noreferrer">한국관광공사 ↗</a><a href="https://www.k-eta.go.kr/" target="_blank" rel="noopener noreferrer">K-ETA 공식 사이트 ↗</a></div></div>
<div class="footbottom">© 2026 코리아 이지트립<div class="credits" id="credits"></div></div></div></footer>
<script src="places.js"></script>
<script src="regions.js"></script>
<script src="i18n-dict.js"></script>
<script src="i18n-places.js"></script>
<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
<script>
(function(){'use strict';
  const $=s=>document.querySelector(s),enc=encodeURIComponent,t=(k,v)=>I18N.t(k,v);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const key=new URLSearchParams(location.search).get('r');
  const P=window.PLACES;
  $('#menuButton').addEventListener('click',()=>{const o=$('#navigation').classList.toggle('open');$('#menuButton').setAttribute('aria-expanded',String(o));});
  function chips(){return '<div class="filters" role="navigation" aria-label="Regions">'+Object.keys(window.REGIONS).map(k=>`<a class="chip" href="region.html?r=${k}" aria-pressed="${k===key}">${esc(window.REGIONS[k].name)}</a>`).join('')+'</div>';}
  const spotCard=(id,fb)=>{const p=P[id];const src=p.img||fb;return `<article class="spot"><div class="day-photo"><img src="${src}" alt="${esc(p.name)}" ${p.img?'':`data-wiki="${esc(p.wiki||'')}"`} loading="lazy"/><a class="photo-src" target="_blank" rel="noopener noreferrer" hidden>사진: 위키백과</a></div><div class="spot-body"><h3>${esc(p.name)}</h3><p>${esc(p.intro)}</p><a class="text-link" href="https://www.google.com/maps/search/?api=1&query=${enc(p.map)}" target="_blank" rel="noopener noreferrer">구글지도에서 위치 보기 ↗</a></div></article>`;};
  const routeUrl=ids=>{const q=ids.map(i=>P[i].map);if(q.length<2)return `https://www.google.com/maps/search/?api=1&query=${enc(q[0])}`;return `https://www.google.com/maps/dir/?api=1&origin=${enc(q[0])}&destination=${enc(q[q.length-1])}`+(q.length>2?`&waypoints=${q.slice(1,-1).map(enc).join('%7C')}`:'');};
  async function loadPhotos(R){
    const titles=[...new Set(R.spots.map(i=>P[i]).filter(p=>!p.img&&p.wiki).map(p=>p.wiki))];if(!titles.length)return;
    try{
      const url='https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&titles='+enc(titles.join('|'));
      const q=(await (await fetch(url)).json()).query||{};const norm={},red={};(q.normalized||[]).forEach(n=>norm[n.from]=n.to);(q.redirects||[]).forEach(n=>red[n.from]=n.to);
      const by={};Object.values(q.pages||{}).forEach(p=>{if(p.thumbnail)by[p.title]=p.thumbnail.source;});
      document.querySelectorAll('img[data-wiki]').forEach(img=>{const w=img.dataset.wiki;let k=w;if(norm[k])k=norm[k];if(red[k])k=red[k];const u=by[k];if(u){img.src=u;const a=img.parentElement.querySelector('a.photo-src');if(a){a.href='https://ko.wikipedia.org/wiki/'+enc(k.replace(/ /g,'_'));a.hidden=false;}}});
    }catch(e){}
  }
  function build(){
    const R=window.REGIONS[key]||null;
    if(!R){document.title=t('notFound');$('#app').innerHTML='<section class="section"><div class="wrap"><h1>'+t('notFound')+'</h1><p class="muted">'+t('notFoundSub')+'</p>'+chips()+'</div></section>';return;}
    document.title=t('regionTitle',{name:R.name});
    let cn=document.querySelector('link[rel=canonical]');if(!cn){cn=document.createElement('link');cn.rel='canonical';document.head.appendChild(cn);}cn.href='https://korea-easytrip.com/region?r='+encodeURIComponent(key);
    const planBtn=R.preset?`<a class="btn btn-lg" href="index.html?preset=${enc(R.preset)}#plan">${esc(t('planBtn',{name:R.name}))}</a>`:`<a class="btn btn-lg" href="index.html#plan">${esc(t('planSeoul'))}</a>`;
    $('#app').innerHTML=`
    <section class="region-hero" style="background-image:url(${R.hero})"><div class="region-shade"></div><div class="wrap region-inner"><a class="back" href="index.html#destinations">${esc(t('back'))}</a><span class="hero-kicker">${esc(R.eng)}</span><h1>${esc(R.name)}</h1><p>${esc(R.tagline)}</p></div></section>
    <section class="wrap"><div class="facts">${R.facts.map(f=>`<div class="fact"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}</div></section>
    <section class="section" style="padding-bottom:30px"><div class="wrap narrow"><span class="eyebrow">${esc(t('about',{name:R.name}))}</span><h2 class="r-h2">${esc(t('thisIs',{name:R.name}))}</h2><p class="lead">${esc(R.intro)}</p><div class="hero-actions" style="margin-top:20px">${planBtn}<a class="btn btn-outline" href="https://www.google.com/maps/search/?api=1&query=${enc(R.map)}" target="_blank" rel="noopener noreferrer">${esc(t('mapBtn',{name:R.name}))}</a></div></div></section>
    <section class="section section-tint"><div class="wrap"><div class="section-title"><div><span class="eyebrow">${esc(t('mustSee'))}</span><h2>${esc(t('topSpots',{name:R.name}))}</h2><p class="muted">${esc(t('topSpotsDesc'))}</p></div></div><div class="spot-grid">${R.spots.map(i=>spotCard(i,R.hero)).join('')}</div></div></section>
    <section class="section"><div class="wrap"><div class="section-title"><div><span class="eyebrow">${esc(t('tastyTrip'))}</span><h2>${esc(R.foodTitle)}</h2></div></div><div class="food-grid">${R.food.map(f=>`<div class="food"><h3>${esc(f[0])}</h3><p>${esc(f[1])}</p></div>`).join('')}</div></div></section>
    <section class="section section-tint"><div class="wrap narrow"><div class="section-title"><div><span class="eyebrow">${esc(t('routeEy'))}</span><h2>${esc(t('routeH',{name:R.name}))}</h2></div></div><ol class="route-list">${R.route.map(r=>`<li><b>${esc(r[0])}</b><div><p>${esc(r[1])}</p><a class="text-link" href="${routeUrl(r[2])}" target="_blank" rel="noopener noreferrer">${esc(t('routeMap'))}</a></div></li>`).join('')}</ol></div></section>
    <section class="section"><div class="wrap narrow"><div class="tips" style="margin-top:0"><h3>${esc(t('tipsTitle'))}</h3><ul>${R.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="mini muted" style="margin:12px 0 0">${esc(t('tipsNote'))}</p></div>
    <div class="dlg-links-title" style="margin-top:22px">공식 정보 바로가기</div><div class="dlg-links">${R.links.map(l=>`<a class="dlg-link" href="${esc(l[1])}" target="_blank" rel="noopener noreferrer"><span>${esc(l[0])}</span><span aria-hidden="true">↗</span></a>`).join('')}</div>
    <div class="dlg-links-title" style="margin-top:26px">${esc(t('otherRegions'))}</div>${chips()}</div></section>`;
    $('#credits').textContent=t('creditsHead')+R.credit+' · '+t('creditsNote');
    loadPhotos(R);
  }
  build();
  I18N.onChange(build);
  I18N.start();
})();
</script>
<script src="ads.js"></script>
</body></html>
